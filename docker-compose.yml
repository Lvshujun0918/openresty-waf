# OpenResty WAF 管理后台（单容器一键部署）
#
# 架构：仅一个管理后台容器（Go+Gin+GORM，内嵌 Vue3 前端）。
#   - Redis：使用你已有的实例，首次启动在引导页填写连接信息
#   - WAF 组件：引导页提供下载与一键脚本，接入本机已部署的 OpenResty
#
# 使用：
#   docker compose up -d --build
#   浏览器打开 http://<host>:18081
#   默认账号 admin / admin123（可用 ADMIN_INIT_PASSWORD 覆盖）

services:
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_ADDR: ":8081"
      ADMIN_DB_TYPE: "sqlite"
      ADMIN_DB_DSN: "/data/waf.db"
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:-openresty-waf-change-me}"
      ADMIN_INIT_PASSWORD: "${ADMIN_INIT_PASSWORD:-admin123}"
    ports:
      - "18081:8081"
    volumes:
      - admin-data:/data

volumes:
  admin-data:
