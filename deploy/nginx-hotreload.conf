# 规则热更新端到端测试配置
# 启用 init_worker（Redis 轮询热更新），配合宿主 Redis 使用。
#
# 运行方式（需宿主 Redis 运行于 127.0.0.1:6379）：
#   docker run -d --rm --name waf-hotreload --network=host \
#     -v "$PWD/../waf":/waf \
#     -v "$PWD/nginx-hotreload.conf":/usr/local/openresty/nginx/conf/nginx.conf \
#     openresty/openresty:alpine

worker_processes  1;

# 开发测试专用：容器内 worker 以 root 运行以读取 root-only 的挂载目录。
user  root;

error_log  stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    lua_package_path  "/waf/?.lua;;";

    lua_shared_dict  waf_rule     20m;
    lua_shared_dict  waf_counter  50m;

    # 加载配置与内置规则到共享内存
    init_by_lua_file  /waf/init.lua;
    # 启动 Redis 规则热更新轮询
    init_worker_by_lua_file  /waf/init.lua;

    server {
        listen 8080;

        access_by_lua_file  /waf/access.lua;
        log_by_lua_file     /waf/log.lua;
        header_filter_by_lua_file  /waf/header_filter.lua;
        body_filter_by_lua_file    /waf/body_filter.lua;

        location / {
            content_by_lua_block {
                ngx.say("hello from openresty-waf")
            }
        }
    }
}
