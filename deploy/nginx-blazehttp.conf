# blazehttp 检测质量门禁专用配置
# 与 nginx-bench-waf.conf 的区别：增加 init_worker_by_lua_file（Redis 规则热更新轮询），
# 引擎 fail-closed 策略要求 Redis 中已有规则集才能放行流量。

worker_processes  auto;
user  root;
error_log  /dev/null emerg;
pid        /tmp/nginx-blazehttp.pid;

events {
    worker_connections  2048;
}

http {
    lua_package_path  "/waf/?.lua;;";

    lua_shared_dict  waf_rule     20m;
    lua_shared_dict  waf_counter  50m;

    init_by_lua_file         /waf/init.lua;
    init_worker_by_lua_file  /waf/init.lua;

    access_log  off;

    server {
        listen 8083;

        access_by_lua_file  /waf/access.lua;
        log_by_lua_file     /waf/log.lua;

        location / {
            content_by_lua_block {
                ngx.say("hello")
            }
        }
    }
}
