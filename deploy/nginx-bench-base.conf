# 性能基准测试：无 WAF 的 OpenResty（对照组）
# 用途：对比加 WAF 前后的性能影响，见 docs/benchmark.md

worker_processes  auto;
user  root;
error_log  /dev/null emerg;
pid        /tmp/nginx-bench-base.pid;

events {
    worker_connections  2048;
}

http {
    access_log  off;

    server {
        listen 8082;

        location / {
            content_by_lua_block {
                ngx.say("hello")
            }
        }
    }
}
