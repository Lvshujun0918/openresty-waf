# WAF 网关（Docker 部署）：作为前置反向代理，检测并清洗流量后转发给后端。
# 配合 docker-compose.yml 使用；生产可修改 proxy_pass 指向你的业务服务。

worker_processes  auto;

# 容器内以 root 运行以访问挂载目录（单容器部署场景）
user  root;

error_log  stderr notice;
pid        /tmp/nginx-gateway.pid;

events {
    worker_connections  2048;
}

http {
    lua_package_path  "/opt/waf/?.lua;;";

    lua_shared_dict  waf_rule     20m;
    lua_shared_dict  waf_counter  50m;

    # 慢速攻击防护：读头/读体超时与 body 缓冲上限（超过则落盘，WAF 仍扫描前 512KB）
    client_header_timeout   10s;
    client_body_timeout     30s;
    client_body_buffer_size 128k;
    send_timeout            30s;

    # 加载配置与内置规则 + 启动 Redis 规则热更新轮询
    init_by_lua_file         /opt/waf/init.lua;
    init_worker_by_lua_file  /opt/waf/init.lua;

    access_log  off;

    server {
        listen 80;

        access_by_lua_file  /opt/waf/access.lua;
        log_by_lua_file     /opt/waf/log.lua;
        # 响应检测（header_filter 改状态码 / body_filter 替换响应体）
        header_filter_by_lua_file  /opt/waf/header_filter.lua;
        body_filter_by_lua_file    /opt/waf/body_filter.lua;

        location / {
            proxy_pass         http://admin:8081;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
