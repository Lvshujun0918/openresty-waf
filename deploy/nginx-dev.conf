# 开发测试用 OpenResty 配置（监听 8086，避免与环境中其他服务端口冲突）
# 挂载 WAF 引擎到 access/log 阶段，验证检测链路。

worker_processes  1;

# 开发测试专用：容器内 worker 以 root 运行以读取 root-only 的挂载目录。
user  root;

error_log  stderr notice;
pid        /tmp/nginx-dev.pid;

events {
    worker_connections  2048;
}

http {
    lua_package_path  "/waf/?.lua;;";

    lua_shared_dict  waf_rule     20m;
    lua_shared_dict  waf_counter  50m;

    init_by_lua_file  /waf/init.lua;

    server {
        listen 8086;

        access_by_lua_file  /waf/access.lua;
        log_by_lua_file     /waf/log.lua;

        location / {
            content_by_lua_block {
                ngx.say("hello from openresty-waf")
            }
        }
    }
}
