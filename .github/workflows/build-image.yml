# 构建并推送管理后台镜像到 GitHub Container Registry (GHCR)
#
# 触发：
#   - push 到 main            -> 打 latest + sha 标签
#   - push 标签 v*            -> 打 semver 标签（如 v1.2.3 -> 1.2.3 / 1.2 / 1）
#   - 手动（workflow_dispatch）
#
# 使用镜像：
#   docker pull ghcr.io/<owner>/openresty-waf:latest
#   docker run -d -p 18081:8081 -v waf-data:/data \
#     -e ADMIN_INIT_PASSWORD=your-password \
#     ghcr.io/<owner>/openresty-waf:latest

name: Build and Push GHCR Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go 后台单元测试
        working-directory: admin
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 前端 Vitest 单元测试
        working-directory: web
        run: |
          npm ci
          npm test

      - name: WAF Lua 引擎单元测试
        run: |
          docker run --rm -v "$PWD/waf:/waf" openresty/openresty:alpine luajit /waf/t/run.lua

  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
